name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts/

      - name: Smoke-test argparse wiring
        run: |
          # The Windows-specific checks cannot run here, but the CLI must parse
          # and the module must import cleanly on any platform.
          python - <<'PY'
          import importlib.util, sys, pathlib
          failures = []
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except Exception as exc:
                  failures.append(f"{path.name}: {exc}")
          if failures:
              print("IMPORT FAILURES:")
              print("\n".join(failures))
              sys.exit(1)
          print("all scripts import cleanly")
          PY

      - name: Verify --help works
        run: |
          for f in scripts/*.py; do
            echo "--- $f"
            python "$f" --help > /dev/null
          done